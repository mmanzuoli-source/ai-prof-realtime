<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>AI Prof Realtime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          sans-serif;
        background: #020617;
        color: #e5e7eb;
        min-height: 100vh;
        padding: 16px;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
      }

      .left-pane,
      .right-pane {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #avatar-3d {
        width: 100%;
        height: 320px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #1f2937;
        background-image: url("wallpaperprof.png");
        background-size: cover;
        background-position: center;
      }

      #avatar-3d canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: transparent !important;
      }

      .panel {
        background: #020617;
        border-radius: 16px;
        border: 1px solid #1f2937;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .right-pane > .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: #9ca3af;
        flex-shrink: 0;
      }

      .xp-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .xp-bar-wrap {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: #020617;
        border: 1px solid #1f2937;
        overflow: hidden;
      }

      #xp-bar {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(to right, #22c55e, #16a34a);
      }

      #messages {
        flex: 1 1 0;
        overflow-y: scroll;
        overflow-x: hidden;
        padding: 8px;
        border-radius: 12px;
        background: #020617;
        border: 1px solid #1f2937;
        display: flex;
        flex-direction: column;
        scrollbar-width: thin;
        scrollbar-color: #374151 #020617;
      }

      #messages::-webkit-scrollbar { width: 8px; }
      #messages::-webkit-scrollbar-track {
        background: #020617;
        border-radius: 8px;
      }
      #messages::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 8px;
      }
      #messages::-webkit-scrollbar-thumb:hover { background: #4b5563; }

      .msg {
        padding: 8px 10px;
        border-radius: 10px;
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.3;
        max-width: 100%;
        flex-shrink: 0;
      }

      .msg.prof {
        background: #0b1120;
        border: 1px solid #1d4ed8;
        align-self: flex-start;
      }

      .msg.user {
        background: #16a34a;
        color: #f9fafb;
        align-self: flex-end;
      }

      .input-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      #user-input {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #020617;
        color: #e5e7eb;
        font-size: 14px;
      }

      #user-input::placeholder { color: #6b7280; }

      .input-buttons {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }

      .round-btn {
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #020617;
        color: #e5e7eb;
        padding: 0 10px;
        font-size: 14px;
        cursor: pointer;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      #send-btn {
        background: #2563eb;
        border: none;
        color: white;
        font-weight: 500;
      }

      #send-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .hud-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: #9ca3af;
        margin-top: 4px;
        flex-shrink: 0;
        flex-wrap: wrap;
        gap: 8px;
      }

      #history-btn {
        cursor: pointer;
        font-size: 13px;
        color: #93c5fd;
        text-decoration: underline;
        background: none;
        border: none;
        padding: 0;
      }

      #logout-btn {
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #111827;
        color: #f9fafb;
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
      }

      #history-panel {
        border-top: 1px solid rgba(31, 41, 55, 0.9);
        max-height: 260px;
        overflow-y: auto;
        padding-top: 8px;
        margin-top: 4px;
        font-size: 13px;
        display: none;
      }

      #history-summary-text { margin-bottom: 4px; }
      #history-content { margin-bottom: 8px; }

      #clear-history-btn {
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #111827;
        color: #f9fafb;
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
      }

      #last-session-summary {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 4px;
      }

      .missions-panel {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid rgba(31, 41, 55, 0.9);
      }

      #missions-streak-label {
        font-size: 13px;
        color: #9ca3af;
        margin-bottom: 4px;
      }

      #missions-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }

      .mission-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .mission-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 1px solid #4b5563;
        background: #020617;
      }

      .mission-dot.completed {
        background: #22c55e;
        border-color: #16a34a;
      }

      .mission-progress {
        font-size: 11px;
        color: #9ca3af;
      }

      /* LOGIN UTENTE NASCOSTO COMPLETAMENTE */
      #login-panel {
        display: none !important;
      }

      /* ADMIN OVERLAY TENUTO MA NASCOSTO DI DEFAULT */
      #admin-login-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.9);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

      .admin-login-box {
        background: #020617;
        border-radius: 16px;
        padding: 24px 28px;
        max-width: 360px;
        width: 100%;
        color: #e5e7eb;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.7);
        border: 1px solid #1f2937;
      }

      .admin-login-box h2 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 20px;
      }

      .admin-login-box p {
        font-size: 13px;
        color: #9ca3af;
        margin-bottom: 16px;
      }

      .admin-login-box input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #020617;
        color: #e5e7eb;
        font-size: 14px;
        margin-bottom: 10px;
      }

      .admin-login-box button {
        width: 100%;
        border-radius: 999px;
        border: none;
        padding: 10px 12px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 500;
        background: #2563eb;
        color: #f9fafb;
      }

      .admin-login-error {
        color: #f97373;
        margin-top: 8px;
        font-size: 12px;
      }

      /* DESKTOP/TABLET: due colonne */
      @media (min-width: 900px) {
        body { padding: 24px; }

        .app-shell {
          flex-direction: row;
          gap: 24px;
        }

        .left-pane { flex: 0 0 40%; }
        .right-pane {
          flex: 1 1 60%;
          min-height: 600px;
        }

        #avatar-3d { height: 480px; }
      }
    </style>
  </head>

  <body>
    <!-- LOGIN ADMIN OVERLAY (non usato ora) -->
    <div id="admin-login-overlay">
      <div class="admin-login-box">
        <h2>Login amministratore</h2>
        <p>Inserisci le credenziali admin per gestire l'app.</p>

        <label for="admin-username">Username</label>
        <input
          id="admin-username"
          type="text"
          autocomplete="username"
          value="Admin"
        />

        <label for="admin-password">Password</label>
        <input
          id="admin-password"
          type="password"
          autocomplete="current-password"
        />

        <button id="admin-login-btn" type="button">
          Entra come admin
        </button>

        <p
          id="admin-login-error"
          class="admin-login-error"
          style="display: none;"
        ></p>
      </div>
    </div>

    <!-- LOGIN OVERLAY UTENTE (TENUTO SOLO COME MARKUP, MA NASCOSTO DA CSS) -->
    <div id="login-panel"></div>

    <!-- APP PRINCIPALE SEMPRE VISIBILE -->
    <div class="app-shell" id="app-panel">
      <section class="left-pane">
        <div id="avatar-3d"></div>

        <div class="panel">
          <div id="history-panel">
            <div id="history-summary-text">
              Nessuna cronologia disponibile.
            </div>
            <div id="history-content"></div>
            <button id="clear-history-btn">Pulisci cronologia</button>
            <div id="last-session-summary"></div>
          </div>

          <div class="missions-panel">
            <div id="missions-streak-label">Nessuna streak</div>
            <div id="missions-list"></div>
          </div>
        </div>
      </section>

      <section class="right-pane">
        <div class="panel">
          <div class="hud-top">
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 4px;
                min-width: 0;
              "
            >
              <div
                style="
                  display: flex;
                  flex-wrap: wrap;
                  gap: 6px;
                  font-size: 12px;
                  color: #9ca3af;
                "
              >
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 4px;
                    min-width: 0;
                  "
                >
                  <span>Scuola:</span>
                  <input
                    id="school-input"
                    type="text"
                    placeholder="es. Prima media"
                    style="
                      flex: 1;
                      min-width: 80px;
                      max-width: 140px;
                      padding: 2px 6px;
                      border-radius: 999px;
                      border: 1px solid #1f2937;
                      background: #020617;
                      color: #e5e7eb;
                      font-size: 11px;
                    "
                  />
                </div>
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 4px;
                    min-width: 0;
                  "
                >
                  <span>Materia:</span>
                  <input
                    id="subject-input"
                    type="text"
                    placeholder="es. Storia"
                    style="
                      flex: 1;
                      min-width: 80px;
                      max-width: 120px;
                      padding: 2px 6px;
                      border-radius: 999px;
                      border: 1px solid #1f2937;
                      background: #020617;
                      color: #e5e7eb;
                      font-size: 11px;
                    "
                  />
                </div>
              </div>
              <div>
                <div id="score-label">XP: 0</div>
                <div id="level-label" style="font-size: 12px; color: #9ca3af;">
                  Livello 1 • Novizio
                </div>
              </div>
            </div>
            <div class="xp-wrapper">
              <span style="font-size: 12px;">Progresso</span>
              <div class="xp-bar-wrap">
                <div id="xp-bar"></div>
              </div>
            </div>
          </div>

          <div id="messages"></div>

          <div
            id="listen-preview"
            style="
              display: none;
              margin-top: 8px;
              font-size: 12px;
              color: #9ca3af;
              padding: 8px;
              border-radius: 10px;
              border: 1px solid #1f2937;
              background: #020617;
              max-height: 80px;
              overflow-y: auto;
            "
          >
            <strong>Testo in modalità ascolto:</strong>
            <span id="listen-preview-text"></span>
          </div>

          <div class="input-row">
            <input
              id="user-input"
              type="text"
              placeholder="Scrivi al tuo prof AI..."
              autocomplete="off"
            />
            <div class="input-buttons">
              <button
                id="mic-btn"
                class="round-btn"
                title="Detta al prof"
              >
                🎤
              </button>

              <button
                id="listen-mode-btn"
                class="round-btn"
                title="Modalità ascolto (lettura e ripetizione)"
              >
                👂
              </button>

              <button
                id="play-voice-btn"
                class="round-btn"
                title="Riprendi la voce"
              >
                ▶️
              </button>
              <button
                id="pause-voice-btn"
                class="round-btn"
                title="Metti in pausa la voce"
              >
                ⏸️
              </button>
              <button
                id="stop-voice-btn"
                class="round-btn"
                title="Ferma la voce"
              >
                ⏹️
              </button>

              <button id="send-btn" class="round-btn">Invia</button>
            </div>
          </div>

          <div class="hud-bottom">
            <span id="status-label">Offline</span>
            <div style="display: flex; gap: 8px; align-items: center;">
              <button id="history-btn">Cronologia</button>
              <button id="logout-btn">Logout</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      window.THREE = THREE;
    </script>

    <script type="module" src="/app/avatar.js"></script>
    <script type="module" src="/app/main.v2.fix.js"></script>
  </body>
</html>
