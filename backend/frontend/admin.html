<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>AI Prof — Dashboard Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #020617;
        color: #e5e7eb;
        min-height: 100vh;
        padding: 24px 16px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .header h1 { font-size: 20px; color: #f9fafb; }
      .header span { font-size: 13px; color: #9ca3af; }

      .btn {
        border-radius: 999px;
        border: none;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        font-weight: 500;
      }

      .btn-primary { background: #2563eb; color: #fff; }
      .btn-danger  { background: #dc2626; color: #fff; }
      .btn-warning { background: #d97706; color: #fff; }
      .btn-ghost {
        background: none;
        border: 1px solid #374151;
        color: #9ca3af;
      }

      .btn:disabled { opacity: 0.4; cursor: default; }

      .card {
        background: #0f172a;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 24px;
        max-width: 480px;
      }

      .card h2 { font-size: 15px; margin-bottom: 14px; color: #f9fafb; }

      .form-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }

      .form-row label { font-size: 12px; color: #9ca3af; }

      .form-row input {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #020617;
        color: #e5e7eb;
        font-size: 13px;
        width: 100%;
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid #1f2937;
        border-radius: 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      thead th {
        background: #0f172a;
        padding: 10px 14px;
        text-align: left;
        color: #9ca3af;
        font-weight: 500;
        white-space: nowrap;
      }

      tbody tr {
        border-top: 1px solid #1f2937;
        transition: background 0.15s;
      }

      tbody tr:hover { background: #0b1120; }

      tbody td {
        padding: 10px 14px;
        vertical-align: middle;
        white-space: nowrap;
      }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
      }

      .badge-admin { background: #1d4ed8; color: #bfdbfe; }
      .badge-user  { background: #1f2937; color: #9ca3af; }

      .actions { display: flex; gap: 6px; }

      #modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      #modal-overlay.open { display: flex; }

      .modal-box {
        background: #0f172a;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 360px;
      }

      .modal-box h3 { font-size: 16px; margin-bottom: 12px; }

      .modal-box input {
        width: 100%;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #020617;
        color: #e5e7eb;
        font-size: 13px;
        margin-bottom: 12px;
      }

      .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

      #toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: #16a34a;
        color: #fff;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        z-index: 200;
      }

      #toast.error { background: #dc2626; }
      #toast.show  { opacity: 1; }

      #loading {
        text-align: center;
        padding: 40px;
        color: #6b7280;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div>
        <h1>Dashboard Amministratore</h1>
        <span>AI Prof Realtime</span>
      </div>
      <button class="btn btn-ghost" id="logout-btn">Esci</button>
    </div>

    <!-- Form crea utente -->
    <div class="card">
      <h2>Crea nuovo utente</h2>
      <div class="form-row">
        <label for="new-name">Nome</label>
        <input id="new-name" type="text" placeholder="Mario Rossi" />
      </div>
      <div class="form-row">
        <label for="new-email">Email</label>
        <input id="new-email" type="email" placeholder="mario@scuola.it" />
      </div>
      <div class="form-row">
        <label for="new-password">Password</label>
        <input id="new-password" type="password" placeholder="Minimo 4 caratteri" />
      </div>
      <button class="btn btn-primary" id="create-btn">Crea utente</button>
    </div>

    <!-- Tabella utenti -->
    <div id="loading">Caricamento utenti...</div>

    <div class="table-wrap" id="table-wrap" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Ruolo</th>
            <th>Registrato il</th>
            <th>Ultimo accesso</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>

    <!-- Modal reset password -->
    <div id="modal-overlay">
      <div class="modal-box">
        <h3>Reset password</h3>
        <p id="modal-user-label" style="font-size:13px;color:#9ca3af;margin-bottom:12px;"></p>
        <input id="modal-new-password" type="password" placeholder="Nuova password (min 4 caratteri)" />
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-cancel">Annulla</button>
          <button class="btn btn-warning" id="modal-confirm">Reimposta</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script>
      const BASE_URL =
        window.location.hostname === "localhost"
          ? "http://localhost:8000"
          : "https://www.aiprofrealtime.com";

      const ADMIN_TOKEN_KEY = "ai_prof_admin_token";

      // ── Protezione pagina: se non c'è token → torna al login ──────
      const token = localStorage.getItem(ADMIN_TOKEN_KEY);
      if (!token) {
        window.location.href = "/app/";
      }

      function authHeaders() {
        return {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        };
      }

      // ── Toast ──────────────────────────────────────────────────────
      function showToast(msg, isError = false) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = isError ? "error show" : "show";
        setTimeout(() => {
          el.className = isError ? "error" : "";
        }, 3000);
      }

      // ── Formatta data ISO ──────────────────────────────────────────
      function fmtDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        return d.toLocaleDateString("it-IT", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escAttr(s) {
        return String(s).replace(/'/g, "\\'");
      }

      // ── Carica utenti dal backend ──────────────────────────────────
      async function loadUsers() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("table-wrap").style.display = "none";

        try {
          const res = await fetch(`${BASE_URL}/admin/users`, {
            headers: authHeaders(),
          });

          if (res.status === 401) {
            localStorage.removeItem(ADMIN_TOKEN_KEY);
            window.location.href = "/app/";
            return;
          }

          const users = await res.json();
          renderTable(users);
        } catch (e) {
          console.error(e);
          showToast("Errore caricamento utenti", true);
        } finally {
          document.getElementById("loading").style.display = "none";
        }
      }

      // ── Render tabella ─────────────────────────────────────────────
      function renderTable(users) {
        const tbody = document.getElementById("users-tbody");
        tbody.innerHTML = "";

        if (!users || users.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" style="text-align:center;color:#6b7280;padding:24px;">
                Nessun utente registrato
              </td>
            </tr>`;
        } else {
          users.forEach((u) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${u.id}</td>
              <td>${escHtml(u.name)}</td>
              <td>${escHtml(u.email)}</td>
              <td>
                <span class="badge ${u.is_admin ? "badge-admin" : "badge-user"}">
                  ${u.is_admin ? "Admin" : "Utente"}
                </span>
              </td>
              <td>${fmtDate(u.created_at)}</td>
              <td>${fmtDate(u.last_login)}</td>
              <td>
                <div class="actions">
                  <button
                    class="btn btn-warning"
                    onclick="openResetModal(${u.id}, '${escAttr(u.name)}')"
                  >Reset pwd</button>
                  <button
                    class="btn btn-danger"
                    onclick="deleteUser(${u.id}, '${escAttr(u.name)}')"
                  >Elimina</button>
                </div>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }

        document.getElementById("table-wrap").style.display = "block";
      }

      // ── Crea utente ────────────────────────────────────────────────
      document
        .getElementById("create-btn")
        .addEventListener("click", async () => {
          const name = document.getElementById("new-name").value.trim();
          const email = document.getElementById("new-email").value.trim();
          const password = document
            .getElementById("new-password")
            .value.trim();

          if (!name || !email || !password) {
            showToast("Compila tutti i campi", true);
            return;
          }

          const btn = document.getElementById("create-btn");
          btn.disabled = true;

          try {
            const res = await fetch(`${BASE_URL}/admin/users`, {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify({ name, email, password }),
            });

            const data = await res.json();
            if (!res.ok) {
              showToast(data.detail || "Errore creazione utente", true);
              return;
            }

            showToast(`Utente "${data.name}" creato`);
            document.getElementById("new-name").value = "";
            document.getElementById("new-email").value = "";
            document.getElementById("new-password").value = "";
            await loadUsers();
          } catch (e) {
            console.error(e);
            showToast("Errore di connessione", true);
          } finally {
            btn.disabled = false;
          }
        });

      // ── Elimina utente ─────────────────────────────────────────────
      async function deleteUser(id, name) {
        if (
          !confirm(
            `Eliminare l'utente "${name}"? L'operazione è irreversibile.`
          )
        )
          return;

        try {
          const res = await fetch(`${BASE_URL}/admin/users/${id}`, {
            method: "DELETE",
            headers: authHeaders(),
          });

          if (!res.ok) {
            const data = await res.json();
            showToast(data.detail || "Errore eliminazione", true);
            return;
          }

          showToast(`Utente "${name}" eliminato`);
          await loadUsers();
        } catch (e) {
          console.error(e);
          showToast("Errore di connessione", true);
        }
      }

      // ── Modal reset password ───────────────────────────────────────
      let resetTargetId = null;

      function openResetModal(id, name) {
        resetTargetId = id;
        document.getElementById("modal-user-label").textContent =
          `Utente: ${name}`;
        document.getElementById("modal-new-password").value = "";
        document.getElementById("modal-overlay").classList.add("open");
      }

      function closeResetModal() {
        resetTargetId = null;
        document.getElementById("modal-overlay").classList.remove("open");
      }

      async function confirmResetPassword() {
        const newPwd = document
          .getElementById("modal-new-password")
          .value.trim();
        if (!newPwd || newPwd.length < 4) {
          showToast("Password minima 4 caratteri", true);
          return;
        }
        if (!resetTargetId) return;

        try {
          const res = await fetch(
            `${BASE_URL}/admin/users/${resetTargetId}/password`,
            {
              method: "PUT",
              headers: authHeaders(),
              body: JSON.stringify({ new_password: newPwd }),
            }
          );

          const data = await res.json();
          if (!res.ok) {
            showToast(data.detail || "Errore reset password", true);
            return;
          }

          showToast("Password aggiornata");
          closeResetModal();
        } catch (e) {
          console.error(e);
          showToast("Errore di connessione", true);
        }
      }

      // Espone funzioni usate negli onclick in tabella
      window.openResetModal = openResetModal;
      window.deleteUser = deleteUser;

      // ── Eventi modal ───────────────────────────────────────────────
      document
        .getElementById("modal-cancel")
        .addEventListener("click", closeResetModal);
      document
        .getElementById("modal-confirm")
        .addEventListener("click", confirmResetPassword);
      document
        .getElementById("modal-overlay")
        .addEventListener("click", (e) => {
          if (e.target.id === "modal-overlay") closeResetModal();
        });

      // ── Logout admin ───────────────────────────────────────────────
      document
        .getElementById("logout-btn")
        .addEventListener("click", () => {
          localStorage.removeItem(ADMIN_TOKEN_KEY);
          window.location.href = "/app/";
        });

      // ── Bootstrap pagina ───────────────────────────────────────────
      loadUsers();
    </script>
  </body>
</html>
